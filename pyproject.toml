[project]
name = "umss"
version = "0.1.0"
description = "Unsupervised Music Source Separation Using Differentiable Parametric Source Models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6",
    "torchaudio>=2.6",
    "numpy>=2.0",
    "scipy>=1.13",
    "librosa>=0.10",
    "soundfile>=0.12",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "tensorboard>=2.17",
    "tqdm>=4.66",
    "configargparse>=1.7",
]

[project.optional-dependencies]
robustness = [
    "torchcrepe>=0.0.23",
    "mido>=1.3",
]

[dependency-groups]
dev = [
    "spectrum>=0.9",
]

[tool.uv]
package = false
